<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#20140d" />
  <meta name="description" content="브라우저에서 즐기는 오프라인 오목 게임" />
  <base href="/" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/board-themes.css" />
  <link rel="stylesheet" href="Gomoku.Web.styles.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>오목 한판</title>
</head>
<body>
  <div id="app"><div class="loading">오목판을 준비하고 있습니다…</div></div>
  <div id="blazor-error-ui">문제가 발생했습니다. <a href="." class="reload">다시 불러오기</a></div>
  <script src="_framework/blazor.webassembly.js"></script>
  <script>
    window.addEventListener('load', async () => {
      if (!('serviceWorker' in navigator)) return;

      try {
        const registration = await navigator.serviceWorker.register('service-worker.js', {
          updateViaCache: 'none'
        });
        await registration.update();
      } catch (error) {
        console.warn('앱 업데이트 확인에 실패했습니다.', error);
      }
    });
  </script>
</body>
</html>
